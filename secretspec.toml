[project]
name = "cmugpt-surface"
revision = "1.0"

[providers]
local = "dotenv://.env"
vault = "vault://secrets.scottylabs.org/secret"

[profiles.ci.defaults]
required = false

[profiles.default]
OIDC_CLIENT_ID = { description = "OIDC client ID", default = "sl-ai-local", required = false, providers = [
  "vault",
] }
OIDC_CLIENT_SECRET = { description = "OIDC client secret", required = false, providers = [
  "vault",
] }
OIDC_ISSUER_URL = { description = "OIDC issuer URL", providers = ["vault"] }
OAUTH_RELAY_URL = { description = "Shared ricochet OAuth relay callback URL", required = false, providers = [
  "vault",
] }
AGENT_API_URL = { description = "cmugpt-agent base URL", default = "https://api.cmugpt-agent.scottylabs.org", providers = [
  "vault",
] }
AGENT_SHARED_SECRET = { description = "Must match agent's AGENT_SHARED_SECRET", required = false, providers = [
  "vault",
] }
OPENAI_API_KEY = { description = "OpenAI key for the free moderation endpoint that screens user messages", required = false, providers = [
  "vault",
] }
ALLOWED_ORIGINS_REGEX = { description = "Allowed origins", default = ".", providers = [
  "vault",
] }

[profiles.prod]

[profiles.staging]

[profiles.preview]

[profiles.dev.defaults]
providers = ["vault"]

[profiles.dev]
