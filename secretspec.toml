[project]
name = "cmugpt-surface"
revision = "1.0"

[providers]
openbao = "openbao://secrets.scottylabs.org/secret"

[defaults]
providers = ["openbao"]

[profiles.default]
OIDC_CLIENT_ID = { description = "OIDC client ID", default = "sl-ai-local", required = false }
OIDC_CLIENT_SECRET = { description = "OIDC client secret", required = false }
OIDC_ISSUER_URL = { description = "OIDC issuer URL" }
OAUTH_RELAY_URL = { description = "Shared ricochet OAuth relay callback URL", required = false }
AGENT_API_URL = { description = "cmugpt-agent base URL", default = "https://api.cmugpt-agent.scottylabs.org" }
AGENT_SHARED_SECRET = { description = "Must match agent's AGENT_SHARED_SECRET", required = false }
ALLOWED_ORIGINS_REGEX = { description = "Allowed origins", default = "." }
PUBLIC_API_URL = { description = "API base URL the web app calls", required = false }

[profiles.prod]
PUBLIC_API_URL = { description = "API base URL the web app calls", default = "https://api.cmugpt.com" }

[profiles.staging]

[profiles.preview]

[profiles.dev]

[scopes.public]
secrets = ["PUBLIC_API_URL"]
