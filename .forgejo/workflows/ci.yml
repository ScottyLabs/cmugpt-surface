name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: docker
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v6

      - name: Setup Bun
        uses: https://github.com/oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright
        run: bunx playwright install --with-deps chromium

      - name: Check EditorConfig
        run: bunx editorconfig-checker --exclude '^LICENSE'

      - name: Lint Markdown
        run: bunx markdownlint-cli2

      - name: Check Dependency Versions
        run: bun run syncpack

      - name: Generate API Artifacts
        run: bun run generate

      - name: Check Workspace
        run: bun run check

      - name: Build
        run: bun run build

      - name: Test Browser Surface
        run: bun run test:e2e
