<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Bark</title>
    <link rel="icon" href="/sl-logo.svg" type="image/svg+xml" />

    <!--
      Shown when MAINTENANCE_MODE is true in apps/web/src/maintenance.ts.
      Type and neutrals mirror the app's tokens in src/styles.css. Light only:
      the app has no dark theme, and color-scheme keeps the browser from
      auto-inverting it. Self-contained on purpose -- no image, font, or
      stylesheet requests, so it renders even if nothing else is served.
    -->
    <style>
      :root {
        color-scheme: light;
        --fg-primary: #1e1e1e;
        --page: #f5f5f5;
        --card: #fff;
        --stroke: #d6d6d6;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: var(--page);
        color: var(--fg-primary);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Oxygen", "Ubuntu", "Cantarell",
          "Fira Sans", "Droid Sans", "Helvetica Neue", sans-serif;
        font-size: 1.125rem;
        font-weight: 500;
        line-height: 1.625rem;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      main {
        width: 100%;
        max-width: 24rem;
        padding: 2.5rem 2rem;
        text-align: center;
        background: var(--card);
        border: 1px solid var(--stroke);
        border-radius: 0.875rem;
      }
      h1 {
        margin: 0;
        font-size: 1.375rem;
        font-weight: 600;
        line-height: 1.875rem;
        letter-spacing: -0.01em;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>We will be back soon</h1>
    </main>
  </body>
</html>
