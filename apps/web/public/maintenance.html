<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>CMU GPT</title>
    <link rel="icon" href="/sl-logo.svg" type="image/svg+xml" />

    <style>
      :root {
        color-scheme: light;
        --fg-primary: #1e1e1e;
        --fg-secondary: #666;
        --stroke: #d6d6d6;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: #fff;
        color: var(--fg-primary);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Oxygen", "Ubuntu", "Cantarell",
          "Fira Sans", "Droid Sans", "Helvetica Neue", sans-serif;
        font-size: 1.125rem;
        font-weight: 500;
        line-height: 1.625rem;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      main {
        text-align: center;
      }
      img {
        width: 3.5rem;
        height: auto;
        margin: 0 0 1.5rem;
      }
      h1 {
        margin: 0;
        font-size: 1.5rem;
        font-weight: 600;
        line-height: 2rem;
        letter-spacing: -0.01em;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/sl-logo.svg" alt="ScottyLabs" />
      <h1>We will be back soon</h1>
    </main>
  </body>
</html>
