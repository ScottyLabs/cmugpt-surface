<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>cmuGPT is down for maintenance</title>
    <link rel="icon" href="/sl-logo.svg" />

    <style>
      :root {
        color-scheme: light dark;
        --bg: #fbfaf8;
        --fg: #1a1a19;
        --muted: #6b6a67;
        --card: #fff;
        --border: #e6e3de;
        --accent: #c41230;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #16161a;
          --fg: #f2f1ee;
          --muted: #a3a19c;
          --card: #1f1f24;
          --border: #2e2e35;
          --accent: #ff4d64;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: var(--bg);
        color: var(--fg);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        line-height: 1.6;
      }
      main {
        width: 100%;
        max-width: 28rem;
        padding: 2.25rem 2rem;
        text-align: center;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 0.875rem;
      }
      .mark {
        width: 2.75rem;
        height: 2.75rem;
        margin: 0 auto 1.25rem;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 0.625rem;
        background: var(--accent);
        color: #fff;
        font-weight: 700;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.375rem;
        font-weight: 650;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
        color: var(--muted);
      }
      .note {
        margin-top: 1.5rem;
        padding-top: 1.25rem;
        border-top: 1px solid var(--border);
        font-size: 0.875rem;
      }
      a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">SL</div>
      <h1>Sorry, CMUGPT is down.</h1>
      <p>We're doing some maintenance and will be back shortly.</p>
    </main>
  </body>
</html>
